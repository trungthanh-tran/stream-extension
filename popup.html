<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Video Tải Về</title>
<style>
  body { width: 360px; margin: 0; font: 13px system-ui, "Segoe UI", Arial, sans-serif; color: #222; background: #fff; }
  h1 { font-size: 14px; margin: 0; padding: 10px 12px; border-bottom: 1px solid #e5e5e5; }
  h2 { font-size: 12px; color: #666; margin: 10px 12px 4px; text-transform: uppercase; }
  ul { list-style: none; margin: 0; padding: 0 12px 10px; }
  li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
  .t { flex: 1; min-width: 0; }
  .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m { color: #777; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { border: 0; border-radius: 5px; background: #e53935; color: #fff; padding: 6px 10px; cursor: pointer; font-weight: 600; }
  button:disabled { background: #999; cursor: default; }
  button.rec { background: #8e1c1c; }
  .empty { padding: 16px 12px; color: #777; }
</style>
</head>
<body>
<h1>Video trên trang này</h1>
<div id="list"></div>
<script src="popup.js"></script>
</body>
</html>
